name: Build

on:
  push:
    branches: [main]
  pull_request:

# El workflow solo lee el repo: no necesita permisos de escritura.
permissions:
  contents: read

# Un push nuevo cancela la ejecucion anterior de la misma rama.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Chromium solo hace falta para regenerar el catálogo PDF, no para compilar.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      # El build revisado queda descargable unos dias, por si hay que publicarlo o inspeccionarlo.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
